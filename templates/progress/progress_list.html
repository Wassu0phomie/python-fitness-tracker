{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <h2 class="fw-bold mb-4">Мой прогресс</h2>

    <div class="row">
        <div class="col-lg-8 mb-4">
            <div class="card shadow-sm border-0 p-4">
                <h5 class="fw-bold">Динамика веса</h5>
                <canvas id="weightChart" width="400" height="200"></canvas>
            </div>
        </div>

        <div class="col-lg-4 mb-4">
            <div class="card shadow-sm border-0 p-4 text-center bg-primary text-white">
                <h6>Новый замер?</h6>
                <p class="small">Зафиксируй результат сегодня</p>
                <a href="{% url 'progress:add' %}" class="btn btn-light rounded-pill">Добавить данные</a>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <h5 class="fw-bold">История в фото</h5>
        {% for log in logs %}
            {% if log.photo %}
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <img src="{{ log.photo.url }}" class="card-img-top rounded" alt="Прогресс">
                    <div class="card-footer bg-white small text-muted text-center">
                        {{ log.date|date:"d.m.Y" }} ({{ log.weight }} кг)
                    </div>
                </div>
            </div>
            {% endif %}
        {% endfor %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const ctx = document.getElementById('weightChart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: {{ labels|safe }},
            datasets: [{
                label: 'Вес (кг)',
                data: {{ weight_data|safe }},
                borderColor: '#0d6efd',
                tension: 0.3,
                fill: true,
                backgroundColor: 'rgba(13, 110, 253, 0.05)'
            }]
        }
    });
</script>
{% endblock %}
