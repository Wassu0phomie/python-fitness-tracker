<div class="card border-0 shadow-sm transition-hover h-100" id="photo-{{ photo.id }}" style="border-radius: 18px; overflow: hidden;">
    <div class="position-relative">
        <img src="{{ photo.image.url }}"
             class="card-img-top"
             style="height: 220px; object-fit: cover; cursor: pointer;"
             data-bs-toggle="modal"
             data-bs-target="#imageModal"
             data-bs-img="{{ photo.image.url }}"
             data-bs-caption="{{ photo.created_at|date:'d.m.Y' }} — {{ photo.weight }} кг">

        <button class="btn btn-danger btn-sm position-absolute top-0 end-0 m-2 rounded-circle shadow-sm"
                hx-post="{% url 'delete_photo' photo.id %}"
                hx-target="#photo-{{ photo.id }}"
                hx-swap="outerHTML"
                hx-confirm="Удалить этот замер?">
            <i class="bi bi-x"></i>
        </button>
    </div>

    <div class="card-body p-2 px-3 bg-white">
        <div class="d-flex justify-content-between align-items-center">
            <span class="fw-bold text-dark">{{ photo.weight }} кг</span>
            <span class="text-muted small">{{ photo.created_at|date:"d.m" }}</span>
        </div>
        {% if photo.comment %}
            <p class="small text-secondary mt-1 mb-0 text-truncate" title="{{ photo.comment }}">
                {{ photo.comment }}
            </p>
        {% endif %}
    </div>
</div>

<style>
.transition-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
.transition-hover:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.1) !important; }
</style>
