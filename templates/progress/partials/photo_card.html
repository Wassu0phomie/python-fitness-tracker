<div class="col-6 col-md-4 col-lg-3 mb-3" id="photo-{{ photo.id }}">
    <div class="card border-0 shadow-sm overflow-hidden h-100" style="border-radius: 20px;">
        <div class="position-relative">
            {% if photo.image %}
                <img src="{{ photo.image.url }}" class="card-img-top" style="height: 200px; object-fit: cover;">
            {% else %}
                <div class="bg-light d-flex align-items-center justify-content-center" style="height: 200px;">
                    <i class="bi bi-camera text-muted fs-1"></i>
                </div>
            {% endif %}
            <button class="btn btn-danger btn-sm position-absolute top-0 end-0 m-2 rounded-circle"
                    hx-post="{% url 'delete_photo' photo.id %}"
                    hx-target="#photo-{{ photo.id }}"
                    hx-swap="outerHTML"
                    hx-confirm="Удалить эту запись?">
                <i class="bi bi-x"></i>
            </button>
        </div>
        <div class="card-body p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="badge bg-dark rounded-pill">{{ photo.created_at|date:"d.m.y" }}</span>
                {% if photo.weight %}
                    <span class="fw-bold text-primary">{{ photo.weight }} кг</span>
                {% endif %}
            </div>
            {% if photo.comment %}
                <p class="small text-muted mb-0 italic">"{{ photo.comment }}"</p>
            {% endif %}
        </div>
    </div>
</div>
