{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Авторизация | FITAPP{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{% static 'images/logo/logo.jpeg' %}">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="stylesheet" href="{% static 'css/welcome_style.css' %}">
    <link rel="stylesheet" href="{% static 'css/login_style.css' %}">
        <style>
        .full-screen-bg {
        background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
    }
    </style>
</head>

<body>
    <div class="full-screen-bg"></div>

    <header id="main-header" class="main-header">
        <div class="container header-wrap">
            <div class="header__left-group">
                <a href="/" class="header-logo">FIT<span>APP</span></a>
            </div>
            <div class="header__right">
                <a href="/" class="btn-fitstars">На главную</a>
            </div>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card {% block auth_card_class %}{% endblock %}" id="auth-card">

            {% block auth_content %}{% endblock %}

            <div class="overlay-container">
                <div class="overlay">
                    <div class="overlay-panel overlay-left">
                        <h1>С возвращением!</h1>
                        <p>Чтобы оставаться на связи, войдите под своими данными</p>
                        <button class="ghost" id="signIn">Войти</button>
                    </div>
                    <div class="overlay-panel overlay-right">
                        <h1>Привет, Атлет!</h1>
                        <p>Начни свой путь к идеальному телу вместе с нами</p>
                        <button class="ghost" id="signUp">Регистрация</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const signUpButton = document.getElementById('signUp');
        const signInButton = document.getElementById('signIn');
        const authCard = document.getElementById('auth-card');

        if (signUpButton && signInButton) {
            signUpButton.addEventListener('click', () => authCard.classList.add("right-panel-active"));
            signInButton.addEventListener('click', () => authCard.classList.remove("right-panel-active"));
        }
    </script>
</body>
</html>
