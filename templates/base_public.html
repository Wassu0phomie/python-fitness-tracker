{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FITAPP{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{% static 'images\logo\logo.jpeg' %}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/welcome_style.css' %}">

    {% block extra_css %}{% endblock %}
</head>
<body class="light-theme">

    <header id="main-header" class="main-header">
        <div class="container">
            <div class="header__left-group">
                <a href="/" class="header-logo">FIT<span>APP</span></a>
                <input type="checkbox" id="menu-bar">
                <label for="menu-bar" class="burger-label"><i class="bi bi-list"></i></label>
                <nav class="header__menu">
                    <ul class="header__menu-content">
                        <li class="header__menu-item"><a href="{% url 'exercise_list' %}" class="nav-link">Программы</a></li>
                        <li class="header__menu-item"><a href="{% url 'recipe_list' %}" class="nav-link">Рецепты</a></li>
                    </ul>
                </nav>
            </div>
            <div class="header__right">
                {% if user.is_authenticated %}
                    <a href="{% url 'profile' %}" class="btn-fitstars">Профиль</a>
                {% else %}
                    <a href="{% url 'login' %}?signup=true" class="btn-fitstars">Начать</a>
                {% endif %}
            </div>
        </div>
    </header>

    {% block content %}{% endblock %}

    {% block extra_js %}{% endblock %}
</body>
</html>
