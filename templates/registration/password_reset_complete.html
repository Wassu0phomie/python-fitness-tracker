{% extends "base_auth.html" %}

{% block title %}Успешная смена пароля | FITAPP{% endblock %}

{% block auth_content %}
<div class="form-container sign-in-container" style="width: 100%; z-index: 5; background: white; display: flex; align-items: center; justify-content: center;">
    <div style="padding: 40px; text-align: center;">

        <h1 class="fw-bold mb-3" style="font-size: 24px;">Успешная смена пароля</h1>

        <a href="{% url 'login' %}" class="btn-main-dark w-100" style="text-decoration: none; display: inline-block; padding: 12px 30px; margin-top: 25px;">
            Войти
        </a>
    </div>
</div>

<style>
    /* Прячем оверлей, так как на этой странице нет переключения на регистрацию */
    .overlay-container { display: none !important; }
    .auth-card {
        width: 450px;
        min-height: 400px;
        display: flex;
        justify-content: center;
    }
</style>
{% endblock %}
