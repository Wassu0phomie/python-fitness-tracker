{% extends "base_auth.html" %}

{% block title %}Сброс пароля | FITAPP{% endblock %}

{% block auth_content %}
<div class="form-container sign-in-container" style="width: 100%; z-index: 5; background: white;">
    <form method="post">
        {% csrf_token %}
        <h1 class="fw-bold mb-4">Сброс пароля</h1>
        <p class="text-muted small mb-4">Введите ваш Email, мы отправим инструкции.</p>

        <input type="email" name="email" placeholder="EMAIL" class="w-100 mb-3" required>

        <button type="submit" class="btn-main-dark w-100">Отправить письмо</button>

        <a href="{% url 'login' %}" class="forgot-pass mt-3">Вернуться ко входу</a>
    </form>
</div>

<style>
    /* Скрываем оверлей на странице сброса пароля, чтобы не мешал */
    .overlay-container { display: none !important; }
    .auth-card { width: 450px; justify-content: center; }
    .sign-in-container { left: 0; width: 100%; }
</style>
{% endblock %}
