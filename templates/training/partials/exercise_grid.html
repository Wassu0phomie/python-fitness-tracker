{% for ex in exercises %}
<div class="col-md-4">
    <div class="card h-100 border-0 shadow-sm-hover cursor-pointer p-2 add-exercise-card"
         style="border-radius: 15px; transition: 0.3s; cursor: pointer;"
         data-exercise-id="{{ ex.id }}"
         data-exercise-name="{{ ex.name }}"
         onclick="addExerciseToDay('{{ ex.id }}', '{{ ex.name|escapejs }}')">
        <div class="text-center mb-2">
            <img src="{{ ex.main_image }}" class="img-fluid rounded"
                 style="height: 100px; object-fit: contain;"
                 onerror="this.src='https://via.placeholder.com/100?text=No+Image'">
        </div>
        <div class="text-center">
            <h6 class="small fw-bold mb-0">{{ ex.name }}</h6>
            <div class="mt-1">
                {% for m in ex.primary_muscles.all|slice:":2" %}
                    <span class="badge bg-light text-muted" style="font-size: 0.55rem;">{{ m.name }}</span>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% empty %}
<div class="col-12 text-center text-muted py-5">
    <i class="bi bi-emoji-frown display-4"></i>
    <p class="mt-3">Упражнения не найдены</p>
</div>
{% endfor %}
