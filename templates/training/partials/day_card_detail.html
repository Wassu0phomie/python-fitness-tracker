<div class="exercise-list">
    {% for item in day.exercises.all %}
    <div class="exercise-card p-3 border-bottom d-flex align-items-center justify-content-between transition" data-exercise-id="{{ item.id }}">
        <div class="d-flex align-items-center flex-grow-1" style="min-width: 0;">
            <div class="form-check mb-0 me-3">
                <input class="form-check-input exercise-checkbox" type="checkbox"
                       id="ex{{ item.id }}"
                       data-exercise-id="{{ item.id }}"
                       checked disabled
                       style="width: 1.5rem; height: 1.5rem;">
            </div>

            <label class="flex-grow-1 mb-0 pe-2" for="ex{{ item.id }}" style="min-width: 0;">
                <div class="fw-bold name-text text-truncate">{{ item.exercise.name }}</div>
                <div class="d-flex gap-2 mt-1">
                    <span class="badge bg-light text-dark border-0 fw-normal">{{ item.sets }} сета</span>
                    <span class="badge bg-light text-dark border-0 fw-normal">{{ item.reps }} повт.</span>
                </div>
            </label>
        </div>

        <a href="{% url 'exercise_detail' item.exercise.slug %}"
           class="btn btn-outline-secondary btn-sm border-0 rounded-circle"
           hx-get="{% url 'exercise_detail' item.exercise.slug %}"
           hx-target="#main-content"
           hx-push-url="true">
            <i class="bi bi-info-circle fs-5"></i>
        </a>
    </div>
    {% endfor %}
</div>

<div class="p-3 bg-light-subtle">
    <div class="alert alert-success d-flex align-items-center rounded-pill py-3 px-4 m-0 border-0 shadow-sm"
         style="background: #D7FD51; color: #000;">
        <i class="bi bi-check-all me-2"></i>
        <span class="fw-bold text-uppercase small">План на сегодня выполнен! Отдыхай</span>
    </div>
</div>
