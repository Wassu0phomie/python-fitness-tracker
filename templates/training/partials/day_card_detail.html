<div class="card bg-dark border-0 rounded-4 mb-3 animate-fade-in" id="day-card-{{ day.id }}">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h5 class="fw-bold mb-0">
                    {{ day.get_day_number_display }}
                    {% if day.is_completed %}
                        <i class="bi bi-check-circle-fill text-success ms-2"></i>
                    {% endif %}
                </h5>
                <small class="text-muted">{{ day.exercises.count }} упражнений</small>
            </div>
            {% if not day.is_completed %}
            <button class="btn btn-success rounded-pill"
                    hx-post="{% url 'complete_workout_htmx' day.id %}"
                    hx-target="#day-card-{{ day.id }}"
                    hx-swap="outerHTML"
                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
                <i class="bi bi-check2-circle"></i> Завершить тренировку
            </button>
            {% else %}
            <span class="badge bg-success rounded-pill py-2 px-3">
                <i class="bi bi-check2-circle"></i> Выполнено
            </span>
            {% endif %}
        </div>

        <!-- Список упражнений -->
        <div class="mt-3">
            {% for ex in day.exercises.all %}
            <div class="d-flex justify-content-between align-items-center py-2 border-bottom border-secondary">
                <div>
                    <span class="fw-bold">{{ ex.exercise.name }}</span>
                </div>
                <div class="text-muted">
                    {{ ex.sets }} × {{ ex.reps }}
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
