<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-black text-uppercase mb-0 profile-title">Мои тренировки</h2>
            <div class="title-underline"></div>
        </div>
        <a href="{% url 'create_plan' %}"
           class="btn btn-dark rounded-pill px-4"
           style="background-color: #D7FD51; color: #000;"
           hx-get="{% url 'create_plan' %}"
           hx-target="#main-content"
           hx-push-url="true">
            <i class="bi bi-plus-lg"></i> Новый план
        </a>
    </div>

    <div id="plans-container"
         hx-get="{% url 'plans_list_partial' %}?filter=all"
         hx-trigger="load"
         hx-swap="outerHTML">
        <div class="text-center py-5">
            <div class="spinner-border text-success" role="status">
                <span class="visually-hidden">Загрузка...</span>
            </div>
        </div>
    </div>
</div>
