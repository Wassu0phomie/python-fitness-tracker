{% if has_next %}
<div id="infinite-scroll-trigger"
     class="col-12 text-center py-4"
     hx-get="{% url 'htmx_load_more_exercises' %}?page={{ next_page }}{% for key, value in filter_params.items %}{% if key != 'page' and value %}&{{ key }}={{ value }}{% endif %}{% endfor %}"
     hx-trigger="intersect once"
     hx-target="#infinite-scroll-trigger"
     hx-swap="outerHTML"
     hx-indicator="#loading-spinner">

    <div id="loading-spinner" class="htmx-indicator">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Загрузка...</span>
        </div>
    </div>
</div>
{% endif %}
