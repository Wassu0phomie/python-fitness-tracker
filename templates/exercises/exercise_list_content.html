{% load static %}

<div class="container py-4">
    <div class="row mb-4 animate-fade-in">
        <div class="col-12">
            <div class="d-flex align-items-end justify-content-between">
                <div>
                    <h2 class="fw-black text-uppercase mb-0 profile-title">База упражнений</h2>
                    <div class="title-underline"></div>
                </div>
                <div class="text-end d-none d-sm-block">
                    <div class="date-badge">
                        <i class="bi bi-lightning-charge me-2"></i>Всего: {{ paginator.count }}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3 mb-4 text-center">
        <div class="col-6 col-md-3">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="h3 fw-bold text-primary" id="exercises-count">{{ paginator.count }}</div>
                    <div class="small text-muted">Упражнений в базе</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="h3 fw-bold text-success">{{ muscle_groups.count }}</div>
                    <div class="small text-muted">Групп мышц</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="h3 fw-bold text-info">{{ equipment.count }}</div>
                    <div class="small text-muted">Видов оборудования</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="h3 fw-bold text-warning">4</div>
                    <div class="small text-muted">Уровня сложности</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Мобильная кнопка фильтров -->
    <div class="d-md-none mb-3 sticky-mobile-filter">
        <button class="btn btn-dark w-100 rounded-pill py-2 fw-bold" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasFilters">
            <i class="bi bi-sliders2 me-2"></i> ФИЛЬТРЫ И ПОИСК
        </button>
    </div>

    <!-- Десктопные фильтры -->
    <div class="card shadow-sm border-0 mb-4 sticky-filter">
        <div class="card-body p-4">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label small">Поиск</label>
                    <input type="text" name="q" id="search-input" value="{{ filter_params.q }}"
                           class="form-control" placeholder="Название..."
                           hx-get="{% url 'exercise_list' %}"
                           hx-trigger="keyup changed delay:300ms"
                           hx-target="#exercises-grid-container"
                           hx-swap="outerHTML">
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Тип</label>
                    <select name="exercise_type" id="type-filter" class="form-select"
                            hx-get="{% url 'exercise_list' %}"
                            hx-trigger="change"
                            hx-target="#exercises-grid-container"
                            hx-swap="outerHTML">
                        <option value="">Все типы</option>
                        {% for value, label in exercise_types %}
                        <option value="{{ value }}" {% if filter_params.exercise_type == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Сложность</label>
                    <select name="difficulty" id="difficulty-filter" class="form-select"
                            hx-get="{% url 'exercise_list' %}"
                            hx-trigger="change"
                            hx-target="#exercises-grid-container"
                            hx-swap="outerHTML">
                        <option value="">Любая</option>
                        {% for value, label in difficulties %}
                        <option value="{{ value }}" {% if filter_params.difficulty == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Мышцы</label>
                    <select name="muscle" id="muscle-filter" class="form-select"
                            hx-get="{% url 'exercise_list' %}"
                            hx-trigger="change"
                            hx-target="#exercises-grid-container"
                            hx-swap="outerHTML">
                        <option value="">Все группы</option>
                        {% for muscle in muscle_groups %}
                        <option value="{{ muscle.slug }}" {% if filter_params.muscle == muscle.slug %}selected{% endif %}>{{ muscle.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12 text-end mt-3">
                    <button id="reset-filters" class="btn btn-outline-secondary"
                            hx-get="{% url 'exercise_list' %}"
                            hx-target="#exercises-grid-container"
                            hx-swap="outerHTML">
                        Сбросить
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Контейнер для сетки упражнений -->
    <div id="exercises-grid-container">
        {% include 'exercises/partials/exercise_grid.html' %}
    </div>
</div>

<!-- Мобильные фильтры Offcanvas -->
<div class="offcanvas offcanvas-bottom h-auto rounded-top-4" tabindex="-1" id="offcanvasFilters" style="max-height: 90vh;">
    <div class="offcanvas-header border-bottom">
        <h5 class="offcanvas-title fw-bold text-uppercase">Фильтры поиска</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <!-- содержимое offcanvas -->
    </div>
</div>

<style>
    .sticky-filter {
        position: sticky;
        top: 0;
        z-index: 100;
        background: white;
        border-radius: 0 !important;
    }
    .sticky-mobile-filter {
        position: sticky;
        top: 0;
        z-index: 100;
        background: white;
        margin: 0 calc(-50vw + 50%);
        width: 100vw;
    }
    .sticky-mobile-filter .btn {
        border-radius: 0;
        width: 100%;
    }
</style>
