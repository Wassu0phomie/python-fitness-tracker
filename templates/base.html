{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FITAPP | Dashboard{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/index_style.css' %}">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <style>
        :root {
            --accent-neon: #D7FD51;
            --accent-dark: #b5d930;
            --sidebar-width: 280px;
            --text-main: #242424;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcfcfc; /*белый фон
            color: var(--text-main);
        }

        /* SIDEBAR */
        #sidebar {
            width: var(--sidebar-width);
            min-height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
            background-color: #ffffff !important;
            border-right: 1px solid #f2f2f2 !important;
        }

        /* Логотип в сайдбаре */
        .sidebar-logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -1px;
            color: #000;
            text-decoration: none;
        }
        .sidebar-logo span {
            color: var(--accent-dark);
        }

        /* Навигация */
        .nav-pills .nav-link {
            color: var(--text-main);
            font-weight: 600;
            padding: 12px 16px;
            margin-bottom: 4px;
            border-radius: 12px; /* Мягкие скругления */
            transition: all 0.2s ease;
        }

        .nav-pills .nav-link:hover {
            background-color: #f8f9fa;
            color: #000;
        }

        /* АКТИВНЫЙ ПУНКТ (Тот самый неон) */
        .nav-pills .nav-link.active {
            background-color: var(--accent-neon) !important;
            color: #000 !important; /* Черный текст на лаймовом фоне */
            box-shadow: 0 4px 12px rgba(215, 253, 81, 0.3);
        }

        .nav-link i {
            font-size: 1.1rem;
            margin-right: 10px;
        }

        /* ОСНОВНОЙ КОНТЕНТ */
        #main-content {
            margin-left: var(--sidebar-width);
            padding: 40px;
        }

        /* HTMX Индикатор */
        .htmx-indicator {
            display:none;
        }
        .htmx-request .htmx-indicator {
            display:inline-block;
        }

        /* Кастомный скроллбар для сайдбара */
        #sidebar::-webkit-scrollbar {
            width: 4px;
        }
        #sidebar::-webkit-scrollbar-thumb {
            background: #eee;
        }
    </style>
</head>
<body>

    <div class="d-flex flex-column flex-shrink-0 p-4 bg-white" id="sidebar">
        <a href="{% url 'index' %}" class="sidebar-logo mb-4 d-block text-center">
            FIT<span>APP</span>
        </a>

        <hr class="mb-4" style="opacity: 0.1;">

        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="{% url 'index' %}" class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}">
                    <i class="bi bi-person-fill"></i> Профиль
                </a>
            </li>
            <li>
                <a href="{% url 'exercise_list' %}" class="nav-link {% if 'exercise' in request.path %}active{% endif %}">
                    <i class="bi bi-fire"></i> Упражнения
                </a>
            </li>
            <li>
                <a href="#" class="nav-link">
                    <i class="bi bi-plus-circle-fill"></i> Новая тренировка
                </a>
            </li>
            <li>
                <a href="#" class="nav-link">
                    <i class="bi bi-calendar-heart"></i> Журнал
                </a>
            </li>
            <li>
                <a href="#" class="nav-link">
                    <i class="bi bi-image"></i> Прогресс в фото
                </a>
            </li>
        </ul>

        <hr style="opacity: 0.1;">

        <div class="dropdown">
            <a href="#" class="d-flex align-items-center link-dark text-decoration-none dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
                <img src="https://ui-avatars.com/api/?name={{ user.username }}&background=D7FD51&color=000" alt="" width="32" height="32" class="rounded-circle me-2">
                <strong class="fw-bold">{{ user.username|default:"Гость" }}</strong>
            </a>
            <ul class="dropdown-menu text-small shadow border-0" aria-labelledby="dropdownUser1">
                <li><a class="dropdown-item py-2" href="#">Настройки</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form action="{% url 'logout' %}" method="post" class="px-3">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-dark w-100 rounded-pill">Выйти</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>

    <main id="main-content">
        <div class="container-fluid">
            <div class="htmx-indicator position-fixed top-0 end-0 m-4">
                <div class="spinner-border text-dark" role="status"></div>
            </div>

            {% block content %}
            {% endblock %}
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });
    </script>
</body>
</html>
